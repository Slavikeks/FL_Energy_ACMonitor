[platformio]
default_envs = wt32-eth01
; Keep generated build products and downloaded project libraries outside checkout.
; Override with PLATFORMIO_WORKSPACE_DIR for simultaneous independent checkouts.
workspace_dir = ${platformio.core_dir}/workspaces/FL_Energy_ACMonitor
extra_configs = platformio.local.ini

[env:wt32-eth01]
platform = platformio/espressif32@6.9.0
board = wt32-eth01
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = partitions_4mb_ota.csv
board_upload.maximum_size = 1966080
lib_deps =
    0neblock/SNMP_Agent@2.1.0
    knolleary/PubSubClient@2.8
extra_scripts = pre:scripts/embed_web_assets.py, pre:scripts/fix_snmp_ber.py, post:scripts/check_build.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -DFL_RS485_AUTO_DIRECTION=1
monitor_speed = 115200
upload_speed = 115200
test_ignore = test_core

[env:native]
platform = platformio/native@1.2.1
lib_deps = throwtheswitch/Unity@2.6.0
build_flags = -std=c++17 -Wall -Wextra -Werror -pedantic -Itest/test_core
build_src_filter = +<core/> +<xye/> +<rotation/> +<alarm/> +<mqtt/Telemetry.cpp> -<main.cpp>
test_framework = unity
test_build_src = yes
test_filter = test_core
